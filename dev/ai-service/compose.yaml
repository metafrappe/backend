# Local model-gateway stack. Run as its own fs-* project, never the shared 7400 stack.
x-data-residency:
  deployment_target: Hetzner (server verification pending)
  local_evidence_only: true
  conversation_store_implemented: false
  persistent_gateway_records: tenant-db
  external_content_policy: masked only when the route permits external processing

services:
  tenant-db:
    extends:
      file: ../compose.tenant.yaml
      service: tenant-db
  tenant-redis:
    extends:
      file: ../compose.tenant.yaml
      service: tenant-redis
    command: ["redis-server", "--save", "", "--appendonly", "yes"]
    volumes:
      - tenant-queue:/data
  tenant-web:
    extends:
      file: ../compose.tenant.yaml
      service: tenant-web
    ports: !reset []
    environment:
      FS_TENANT_WEB_PORT: "8000"
      FS_TENANT_SOCKET_PORT: "9000"
    command: ["bench", "serve", "--port", "8000", "--noreload"]
    depends_on:
      tenant-db:
        condition: service_healthy
      tenant-redis:
        condition: service_healthy
  tenant-worker:
    extends:
      file: ../compose.tenant.yaml
      service: tenant-web
    ports: !reset []
    environment:
      FS_TENANT_WEB_PORT: "8000"
      FS_TENANT_SOCKET_PORT: "9000"
    command: ["bench", "worker", "--queue", "short,default,long"]
    # Only tenant-web answers to the tenant1.localhost alias.
    networks: !override
      default: {}
    depends_on:
      tenant-db:
        condition: service_healthy
      tenant-redis:
        condition: service_healthy
  # tenant-socket is left out: realtime is outside this local gateway check.
  ai-tls:
    image: fs-ai-service-tls:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${AI_HTTPS_PORT:?Choose an unused local port}:443"
    volumes:
      - ai-tls-data:/data
      - ai-tls-config:/config
    depends_on:
      - tenant-web

volumes:
  tenant-db:
  tenant-sites:
  tenant-logs:
  tenant-queue:
  ai-tls-data:
  ai-tls-config:
