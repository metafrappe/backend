# Comment language gate (Decision 44): code comments are written in English.
# The job fails when a file holds more Turkish comments than dev/comment_language/baseline.json allows,
# or when a change raises a number in that baseline. The baseline may only go down.
name: Comment language

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: comment-language-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  comment-language:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Gate tests
        run: python -I -m unittest discover -s dev/comment_language/tests -v
      - name: Check comments against the baseline
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^1' }}
        run: python -I dev/comment_language/check_comments.py --check --base-ref "$BASE_REF"
