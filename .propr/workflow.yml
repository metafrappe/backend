# yaml-language-server: $schema=https://docs.propr.dev/schemas/repository-workflow.schema.json
# Biçim kaynağı: ProPR 0.9.3 belgesi, features/repository-workflow.md, "Auto-merge policy".
# ProPR auto-merge etiketli PR'da GitHub'ın otomatik birleştirmesini kurar.
# Aşağıdaki yolları değiştiren PR'ı insan birleştirir.
auto_merge:
  enabled: true
  protected_paths:
    - ".github/**"
    - ".propr/**"
