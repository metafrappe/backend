# Backend CI: runs the light Jenkins gates on every pull request and on every push to main.
# The gate commands equal the table "Jenkins kapıları" in docs/handoff/ci-security.md.
# Two Jenkins gates are not here: "security audit" needs Docker images and the OSV database,
# "platform_core tests" and "hrms_tr tests" build a Frappe bench. Jenkins keeps running them.
#
# The code root is found at run time: "backend" if that folder exists, else the repository root.
# So the workflow runs before and after the path change of PR 9.
#
# ProPR waits for the check named "build-and-test". The name must not change. The job runs with
# "if: always()", so a skipped gate cannot count as green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: gate (${{ matrix.gate }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: deploy tests
            python: '3.14'
            command: python -I -m unittest discover -s "$ROOT/deploy/tests"
          - gate: dev tests
            python: '3.14'
            command: python -I -m unittest discover -s "$ROOT/dev/tests"
          - gate: security tool tests
            python: '3.12'
            command: python -B -m unittest discover -s "$ROOT/dev/security"
          - gate: module boundaries
            python: '3.14'
            command: '"$ROOT/dev/bin/module-boundaries"'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Find the code root
        run: |
          if [ -d backend/dev ]; then echo "ROOT=backend" >> "$GITHUB_ENV"; else echo "ROOT=." >> "$GITHUB_ENV"; fi
      - name: Run gate
        run: ${{ matrix.command }}

  build-and-test:
    name: build-and-test
    if: always()
    needs: [gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every gate passed
        env:
          RESULT: ${{ needs.gate.result }}
        run: |
          echo "gate result: $RESULT"
          test "$RESULT" = success
